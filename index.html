<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EbookKu</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #ccc;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .book {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .cover {
            height: 220px;
            background: #ddd;
            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 60px;

            margin-bottom: 15px;
        }

        .book h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            margin-bottom: 12px;
        }

        .info {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #222;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #reader {
            display: none;

            background: white;

            margin-top: 30px;
            padding: 25px;

            border-radius: 12px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        #readerTitle {
            margin-bottom: 20px;
        }

        #content {
            line-height: 1.8;
            font-size: 17px;
        }

        .back {
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

    </style>

</head>


<body>

<header>

    <h1>📚 EbookKu</h1>

    <p>Kumpulan ebook favorit kamu</p>

</header>


<div class="container">


    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔍 Cari ebook..."
    >


    <div id="books" class="books">

        <div class="loading">
            Memuat ebook...
        </div>

    </div>


    <div id="reader">

        <h2 id="readerTitle"></h2>

        <div id="content"></div>

        <button
            class="back"
            onclick="closeBook()"
        >
            ← Kembali
        </button>

    </div>


</div>


<script>


// ==========================================
// TEMPAT MENYIMPAN SEMUA DATA EBOOK
// ==========================================

let semuaEbook = [];


// ==========================================
// MENGAMBIL DATA DARI ebooks.json
// ==========================================

async function loadEbooks() {

    try {

        const response = await fetch("https://raw.githubusercontent.com/bahatolib/ebookku/refs/heads/main/ebooks.json");

        if (!response.ok) {

            throw new Error(
                "ebooks.json tidak ditemukan"
            );

        }

        const data = await response.json();

        semuaEbook = data.ebooks;

        tampilkanEbook(semuaEbook);

    }

    catch (error) {

        console.error(error);

        document.getElementById("books").innerHTML = `
            <div class="loading">
                ❌ Gagal memuat ebook.
                <br><br>
                Pastikan server berjalan.
            </div>
        `;

    }

}


// ==========================================
// MENAMPILKAN DAFTAR EBOOK
// ==========================================

function tampilkanEbook(ebooks) {

    const booksContainer =
        document.getElementById("books");


    booksContainer.innerHTML = "";


    if (ebooks.length === 0) {

        booksContainer.innerHTML = `
            <div class="loading">
                Ebook tidak ditemukan.
            </div>
        `;

        return;

    }


    ebooks.forEach(function(ebook) {


        const book =
            document.createElement("div");


        book.className = "book";


        book.innerHTML = `

            <div class="cover">

                ${ebook.cover}

            </div>


            <h2>

                ${ebook.judul}

            </h2>


            <p class="description">

                ${ebook.deskripsi}

            </p>


            <div class="info">

                ✍️ Penulis:
                ${ebook.penulis}

                <br>

                📅 Update:
                ${ebook.update}

            </div>


            <button
                onclick="openBook(${ebook.id})"
            >

                Baca Ebook

            </button>

        `;


        booksContainer.appendChild(book);


    });

}


// ==========================================
// MEMBUKA EBOOK
// ==========================================

function openBook(id) {


    const ebook =
        semuaEbook.find(function(item) {

            return item.id === id;

        });


    if (!ebook) {

        return;

    }


    document.getElementById("books")
        .style.display = "none";


    document.getElementById("search")
        .style.display = "none";


    document.getElementById("reader")
        .style.display = "block";


    document.getElementById("readerTitle")
        .textContent = "📖 " + ebook.judul;


    document.getElementById("content")
        .innerHTML =
        ebook.isi.replace(/\n/g, "<br><br>");

}


// ==========================================
// KEMBALI KE DAFTAR EBOOK
// ==========================================

function closeBook() {


    document.getElementById("reader")
        .style.display = "none";


    document.getElementById("books")
        .style.display = "grid";


    document.getElementById("search")
        .style.display = "block";

}


// ==========================================
// FITUR PENCARIAN
// ==========================================

document.getElementById("search")
    .addEventListener(
        "input",
        function() {


            const keyword =
                this.value.toLowerCase();


            const hasil =
                semuaEbook.filter(
                    function(ebook) {


                        return ebook.judul
                            .toLowerCase()
                            .includes(keyword);


                    }
                );


            tampilkanEbook(hasil);


        }
    );


// ==========================================
// JALANKAN APLIKASI
// ==========================================

loadEbooks();


</script>


</body>

</html>
